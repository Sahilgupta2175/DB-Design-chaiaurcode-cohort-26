<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth App</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
      <div class="w-full max-w-md">
        <header class="mb-6 text-center">
          <h1 class="text-2xl font-bold tracking-tight">Auth App</h1>
          <p class="mt-1 text-sm text-slate-500">Register, login and view your profile</p>
        </header>

        <!-- Message box: JS sets text and swaps classes (see success/error classes below) -->
        <!--
          success: bg-green-50 text-green-700 border-green-200
          error:   bg-red-50   text-red-700   border-red-200
        -->
        <div
          id="message"
          role="alert"
          class="mb-4 hidden rounded-lg border px-4 py-3 text-sm"
        ></div>

        <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
          <!-- Session check state: show on page load, hide after current-user call finishes -->
          <section id="session-loading" class="hidden flex-col items-center gap-3 py-10">
            <span class="h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-indigo-600"></span>
            <p class="text-sm text-slate-500">Checking session...</p>
          </section>

          <!-- Auth section (logged out) -->
          <section id="auth-section">
            <div class="mb-6 grid grid-cols-2 rounded-lg bg-slate-100 p-1 text-sm font-medium">
              <button
                id="tab-login"
                type="button"
                class="rounded-md bg-white py-2 shadow-sm"
              >
                Login
              </button>
              <button
                id="tab-register"
                type="button"
                class="rounded-md py-2 text-slate-500 hover:text-slate-800"
              >
                Register
              </button>
            </div>

            <!-- Login form -->
            <form id="login-form" class="space-y-4" novalidate>
              <div>
                <label for="login-username" class="mb-1 block text-sm font-medium">Username</label>
                <input
                  id="login-username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  required
                  placeholder="doejohn"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                />
              </div>
              <div>
                <label for="login-password" class="mb-1 block text-sm font-medium">Password</label>
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  placeholder="••••••••"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                />
              </div>
              <button
                id="login-btn"
                type="submit"
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60"
              >
                <span class="btn-spinner hidden h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
                <span class="btn-label">Login</span>
              </button>
            </form>

            <!-- Register form -->
            <form id="register-form" class="hidden space-y-4" novalidate>
              <div>
                <label for="register-username" class="mb-1 block text-sm font-medium">Username</label>
                <input
                  id="register-username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  required
                  placeholder="doejohn"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                />
              </div>
              <div>
                <label for="register-email" class="mb-1 block text-sm font-medium">Email</label>
                <input
                  id="register-email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="user.email@domain.com"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                />
              </div>
              <div>
                <label for="register-password" class="mb-1 block text-sm font-medium">Password</label>
                <input
                  id="register-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  required
                  placeholder="••••••••"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                />
              </div>
              <div>
                <label for="register-role" class="mb-1 block text-sm font-medium">Role</label>
                <select
                  id="register-role"
                  name="role"
                  class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                >
                  <option value="USER">USER</option>
                  <option value="ADMIN">ADMIN</option>
                </select>
              </div>
              <button
                id="register-btn"
                type="submit"
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60"
              >
                <span class="btn-spinner hidden h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
                <span class="btn-label">Create account</span>
              </button>
            </form>
          </section>

          <!-- Profile section (logged in) -->
          <section id="profile-section" class="hidden">
            <div class="flex flex-col items-center text-center">
              <img
                id="profile-avatar"
                src=""
                alt="Profile avatar"
                class="h-20 w-20 rounded-full bg-slate-200 object-cover ring-4 ring-indigo-100"
              />
              <h2 id="profile-username" class="mt-3 text-lg font-semibold">username</h2>
              <span
                id="profile-role"
                class="mt-1 rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-medium text-indigo-700"
                >ROLE</span
              >
            </div>

            <dl class="mt-6 divide-y divide-slate-100 text-sm">
              <div class="flex justify-between gap-4 py-3">
                <dt class="text-slate-500">Email</dt>
                <dd id="profile-email" class="truncate font-medium">-</dd>
              </div>
              <div class="flex justify-between gap-4 py-3">
                <dt class="text-slate-500">User ID</dt>
                <dd id="profile-id" class="truncate font-mono text-xs font-medium">-</dd>
              </div>
              <div class="flex justify-between gap-4 py-3">
                <dt class="text-slate-500">Email verified</dt>
                <dd id="profile-verified" class="font-medium">-</dd>
              </div>
              <div class="flex justify-between gap-4 py-3">
                <dt class="text-slate-500">Joined</dt>
                <dd id="profile-created" class="font-medium">-</dd>
              </div>
            </dl>

            <button
              id="logout-btn"
              type="button"
              class="mt-4 flex w-full items-center justify-center gap-2 rounded-lg border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-700 transition hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-200 disabled:cursor-not-allowed disabled:opacity-60"
            >
              <span class="btn-spinner hidden h-4 w-4 animate-spin rounded-full border-2 border-red-300 border-t-red-700"></span>
              <span class="btn-label">Logout</span>
            </button>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
